name: Apply Gagge–Nishi correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-gagge-nishi-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consolidate the Gagge–Nishi eight-site formula
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          dataset = Path("public/data/corpus_main_dataset.csv")
          mst_path = Path("public/data/mst.json")
          bundle_path = Path("public/data/bundle.json")

          source = dataset.read_text(encoding="utf-8-sig")
          assert source.count("Gagge and Nishi (2011)") == 39
          assert source.count("0.020Tcalf") == 39
          dataset.write_text(
              source.replace("Gagge and Nishi (2011)", "Gagge & Nishi (1977)")
                    .replace("0.020Tcalf", "0.20Tcalf"),
              encoding="utf-8-sig",
          )

          def update_mst(payload):
              totals = payload["formula_totals"]
              old = next(row for row in totals if row["formula"] == "Gagge and Nishi (2011)")
              new = next(row for row in totals if row["formula"] == "Gagge & Nishi (1977)")
              assert old["count"] == 3 and new["count"] == 2
              new["count"] += old["count"]
              payload["formula_totals"] = [row for row in totals if row is not old]

              merged = []
              target = None
              for row in payload["point_formula_links"]:
                  row = dict(row)
                  if row["formula"] == "Gagge and Nishi (2011)":
                      row["formula"] = "Gagge & Nishi (1977)"
                  if row["pt_label"] == "8" and row["formula"] == "Gagge & Nishi (1977)":
                      if target is None:
                          target = row
                          merged.append(row)
                      else:
                          target["count"] += row["count"]
                  else:
                      merged.append(row)
              assert target and target["count"] == 5
              payload["point_formula_links"] = merged
              return payload

          mst = update_mst(json.loads(mst_path.read_text(encoding="utf-8")))
          mst_path.write_text(json.dumps(mst, indent=2, ensure_ascii=False), encoding="utf-8")

          bundle = json.loads(bundle_path.read_text(encoding="utf-8"))
          bundle["mst"] = mst
          bundle_path.write_text(json.dumps(bundle, indent=2, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Commit the correction and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-gagge-nishi-correction.yml
          git add public/data/corpus_main_dataset.csv public/data/mst.json public/data/bundle.json
          git commit -m "Normalize Gagge-Nishi MST formula"
          git push
